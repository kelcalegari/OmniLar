name: OmniLar CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  flutter-quality-gate:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: dart analyze

      - name: Run Unit & Widget Tests
        run: flutter test --coverage

  supabase-validation:
    name: Supabase Migrations Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Migrations SQL Presence
        run: |
          echo "Validating SQL migration files presence..."
          ls -la supabase/migrations/

  supabase-deploy:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    needs: [flutter-quality-gate, supabase-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Migrations to Supabase
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Chaves encontradas. Vinculando projeto..."
            supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            echo "Reparando historico remoto de migracoes..."
            supabase migration repair --status applied 20261007004531 --password "$SUPABASE_DB_PASSWORD" || true
            supabase migration repair --status reverted 20261012202228 20261012210421 20261012212321 20261012215810 20261012222356 20261012234222 20261013004034 20261013091033 20261013094226 20261013095006 20261013102609 20261013105349 20261013111018 20261013120710 20261013141231 20261013143855 20261013144536 20261013145752 20261013150906 20261013152611 20261013152731 20261013155541 20261013155544 20261013161424 20261013171440 20261013204828 20261013211856 20261013213954 20261014005329 20261014010237 20261014085452 20261014092439 20261014111613 20261014224418 20261015011541 20261015083519 20261015083544 20261015083547 20261016113619 20261016123250 20261016150343 20261016150443 20261016150503 20261016155220 20261016165512 20261016173022 20261016185538 20261016223410 20261017134059 20261017134144 20261017134147 20261017134150 20261017163105 20261017163156 20261017163159 20261017163224 20261017163244 20261017163315 20261017163341 20261017185234 20261017193635 20261017205634 20261017234927 20261018004634 20261018025020 20261018025156 20261018153625 20261018201216 20261018204320 --password "$SUPABASE_DB_PASSWORD" || true
            echo "Sincronizando historico de migracoes e aplicando pendentes..."
            supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
            echo "Migracoes aplicadas com sucesso no Supabase!"
          else
            echo "::warning title=Supabase Secrets Ausentes::Para ativar a sincronizacao automatica de banco, adicione SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD em Settings > Secrets and variables > Actions no GitHub."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'rygxmpwzofgieodvhpcy' }}

  firebase-web-deploy:
    name: Deploy Web (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: [flutter-quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --dart-define=SENTRY_DSN=https://12b32d1db8bdf0ed9578cdd02e18d9e4@o4512285777657856.ingest.us.sentry.io/4512285825433600

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

  android-build-deploy:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    needs: [flutter-quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --dart-define=SENTRY_DSN=https://12b32d1db8bdf0ed9578cdd02e18d9e4@o4512285777657856.ingest.us.sentry.io/4512285825433600

      - name: Upload APK to Supabase Storage
        run: |
          curl -s -X POST "https://rygxmpwzofgieodvhpcy.supabase.co/storage/v1/object/releases/OmniLar-release.apk" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'sb_publishable_GshamuXeZLHEPF1bch5SgQ_eVXv_ckW' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'sb_publishable_GshamuXeZLHEPF1bch5SgQ_eVXv_ckW' }}" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@build/app/outputs/flutter-apk/app-release.apk"

          curl -s -X POST "https://rygxmpwzofgieodvhpcy.supabase.co/storage/v1/object/releases/OmniLar-arm64-release.apk" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'sb_publishable_GshamuXeZLHEPF1bch5SgQ_eVXv_ckW' }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'sb_publishable_GshamuXeZLHEPF1bch5SgQ_eVXv_ckW' }}" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: OmniLar-Android-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
