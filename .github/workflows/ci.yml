name: OmniLar CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  flutter-quality-gate:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: dart analyze

      - name: Run Unit & Widget Tests
        run: flutter test --coverage

  supabase-validation:
    name: Supabase Migrations Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Migrations SQL Presence
        run: |
          echo "Validating SQL migration files presence..."
          ls -la supabase/migrations/

  supabase-deploy:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    needs: [flutter-quality-gate, supabase-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Migrations to Supabase
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF || 'rygxmpwzofgieodvhpcy' }} --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
          supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Warning if Secrets are Missing
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' || secrets.SUPABASE_DB_PASSWORD == '' }}
        run: |
          echo "::warning title=Supabase Secrets Ausentes::Para ativar a sincronizacao automatica de banco, adicione SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD em Settings > Secrets and variables > Actions no GitHub."
