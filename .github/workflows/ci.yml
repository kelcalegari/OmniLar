name: OmniLar CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  flutter-quality-gate:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Dart Analyzer
        run: dart analyze

      - name: Run Unit & Widget Tests
        run: flutter test --coverage

  supabase-validation:
    name: Supabase Migrations Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Migrations SQL Presence
        run: |
          echo "Validating SQL migration files presence..."
          ls -la supabase/migrations/

  supabase-deploy:
    name: Apply Supabase Migrations
    runs-on: ubuntu-latest
    needs: [flutter-quality-gate, supabase-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Migrations to Supabase
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Chaves encontradas. Vinculando projeto..."
            supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
            echo "Aplicando migracoes pendentes..."
            supabase db push --password "$SUPABASE_DB_PASSWORD"
            echo "Migracoes aplicadas com sucesso no Supabase!"
            echo "Publicando Edge Functions no Supabase..."
            supabase functions deploy capture-read nfce-read import-read assistant delete-account --project-ref "$PROJECT_REF"
            supabase functions deploy notify --no-verify-jwt --project-ref "$PROJECT_REF"
            echo "Edge Functions publicadas com sucesso!"
          else
            echo "::warning title=Supabase Secrets Ausentes::Para ativar a sincronizacao automatica de banco, adicione SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD em Settings > Secrets and variables > Actions no GitHub."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'rygxmpwzofgieodvhpcy' }}

  firebase-web-deploy:
    name: Deploy Web (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: [flutter-quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release --dart-define=SENTRY_DSN=https://12b32d1db8bdf0ed9578cdd02e18d9e4@o4512285777657856.ingest.us.sentry.io/4512285825433600

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"

  android-build-deploy:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest
    needs: [flutter-quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Restore Release Keystore
        # A chave de release vem dos secrets (ver Documentacao/assinatura_android.md); sem ela o job para,
        # para nunca publicar um APK assinado com a chave de debug
        run: |
          for VAR in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!VAR}" ]; then
              echo "::error title=Secret ausente::Adicione $VAR em Settings > Secrets and variables > Actions (ver Documentacao/assinatura_android.md)."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/omnilar-release.jks"
          echo "OMNILAR_KEYSTORE_PATH=$RUNNER_TEMP/omnilar-release.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK Release
        run: flutter build apk --release --target-platform android-arm64 --dart-define=SENTRY_DSN=https://12b32d1db8bdf0ed9578cdd02e18d9e4@o4512285777657856.ingest.us.sentry.io/4512285825433600
        env:
          OMNILAR_REQUIRE_RELEASE_SIGNING: 'true'
          OMNILAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OMNILAR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OMNILAR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK Signature
        # Confere que o APK saiu com a chave de release, e nao com a de debug, antes de publicar
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          CERTS=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$CERTS" | grep -E "certificate (DN|SHA-256 digest)"
          if echo "$CERTS" | grep -q "CN=Android Debug"; then
            echo "::error title=APK com chave de debug::O APK foi assinado com a chave de debug; nada foi publicado."
            exit 1
          fi

      - name: Remove Release Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/omnilar-release.jks"

      - name: Upload APK to Supabase Storage
        # O bucket 'releases' nao aceita escrita publica (0114): o upload exige a service_role
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error title=Secret ausente::Adicione SUPABASE_SERVICE_ROLE_KEY em Settings > Secrets and variables > Actions para publicar o APK."
            exit 1
          fi
          echo "Uploading ARM64 Release APK (size: $(ls -lh build/app/outputs/flutter-apk/app-release.apk | awk '{print $5}'))"
          for NAME in OmniLar-release.apk OmniLar-arm64-release.apk; do
            curl -s -f -X POST "https://rygxmpwzofgieodvhpcy.supabase.co/storage/v1/object/releases/$NAME" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "x-upsert: true" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@build/app/outputs/flutter-apk/app-release.apk"
          done
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: OmniLar-Android-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
